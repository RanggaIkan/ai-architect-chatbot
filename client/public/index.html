<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfbf9" />
    <meta
      name="description"
      content="AETHEL ARCHITECTURE — Engineering Meets Art. Bespoke Real Estate & AI Structural Intelligence."
    />
    <title>AETHEL ARCHITECTURE | Bespoke Real Estate & 3D AI Studio</title>
    <link rel="icon" type="image/png" href="/logo-baru.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN for High-Performance 3D WebGL Visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Premium Fonts: Plus Jakarta Sans & Cormorant Garamond & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', sans-serif;
        --font-serif: 'Cormorant Garamond', serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      body {
        font-family: var(--font-sans);
        background-color: #faf8f5;
        color: #1c1917;
      }
      .font-serif-luxury {
        font-family: var(--font-serif);
      }
      .font-mono-tech {
        font-family: var(--font-mono);
      }
      /* Custom Light Theme Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f5f0eb;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6ccc2;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b7a99a;
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-600 selection:text-white">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
